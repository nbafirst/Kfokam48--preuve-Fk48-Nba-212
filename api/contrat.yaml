openapi: 3.0.3
info:
  title: Contrat imposé — Épreuve finale KFOKAM48
  version: "1.1"
  description: |
    Les cinq opérations décrites ici doivent exister EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    Tout le reste de ton API est libre — ajoute tes propres opérations
    dans ce même fichier, sous /api, avant ton premier commit de code.

    Version 1.1 — opérations additionnelles ajoutées (EFx du cahier des
    charges, docs/CAHIER_DES_CHARGES.md) : les cinq opérations imposées
    restent strictement identiques.

servers:
  - url: http://localhost:8080

paths:

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU · BLOCAGE_ACTIF (RG3)
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE · SESSION_CLOTUREE (RG9)

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  # ===================== OPÉRATIONS ADDITIONNELLES (EFx) =====================

  /api/promotions/{id}/etudiants:
    get:
      summary: Liste des étudiants d'une promotion — l'étudiant choisit son nom (Q1, EF2, H3)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des étudiants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [etudiantId, nom]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/sessions/{id}/presences:
    post:
      summary: Le formateur ajoute une présence à la main (EF4, RG12, H5)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etudiantId]
              properties:
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence créée avec source=FORMATEUR
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [FORMATEUR] }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT · SESSION_CLOTUREE (H5)

  /api/sessions/{id}/cloture:
    post:
      summary: Le formateur clôture la session — tout est figé ensuite (EF12, RG8, RG13)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session clôturée
          content:
            application/json:
              schema:
                type: object
                required: [id, clotureAt]
                properties:
                  id: { type: integer, format: int64 }
                  clotureAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/exercices/{id}/lien:
    put:
      summary: Remplacer le lien tant que la relecture n'a pas commencé (EF6, RG11)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200":
          description: Lien remplacé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut, lien]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
                  lien: { type: string, format: uri }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # LIEN_VERROUILLE (relecture commencée) · SESSION_CLOTUREE
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU

  /api/relectures/en-attente:
    get:
      summary: Relectures qu'un étudiant doit encore rendre — écran relecteur (EF8, RG14)
      parameters:
        - name: relecteurId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relectures assignées non rendues (exercice, auteur masqué, lien, numero)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [relectureId, exerciceId, numero, lien, sessionTitre]
                  properties:
                    relectureId: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    numero: { type: integer, minimum: 1, maximum: 2 }  # 1 ou 2 (deux relecteurs par exercice)
                    lien: { type: string, format: uri }
                    sessionTitre: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

  /api/relectures/{id}/correction:
    post:
      summary: Le relecteur corrige sa note tant que la session n'est pas clôturée (EF9, RG13, C1)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Note corrigée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE

  /api/etudiants/{id}/resultats:
    get:
      summary: Notes et commentaires reçus par l'étudiant, sans nom du relecteur (EF11, RG10, RG16)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Résultats par exercice déposé avec statut de note (AUCUNE/PROVISIONAL/FINAL)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [exerciceId, sessionTitre, statut, statutNote, nbEvaluations]
                  properties:
                    exerciceId: { type: integer, format: int64 }
                    sessionTitre: { type: string }
                    statut: { type: string }        # EN_ATTENTE | ASSIGNE | RELU
                    statutNote: { type: string, enum: [AUCUNE, PROVISIONAL, FINAL] }
                    nbEvaluations: { type: integer, minimum: 0, maximum: 2 }
                    moyenne: { type: number, nullable: true }           # note unique si PROVISIONAL, moyenne si FINAL
                    noteUnique: { type: integer, minimum: 0, maximum: 20, nullable: true }   # si PROVISIONAL
                    commentaireUnique: { type: string, nullable: true }                     # si PROVISIONAL
                    evaluations:                                   # si FINAL (2 évaluations)
                      type: array
                      items:
                        type: object
                        required: [note, commentaire]
                        properties:
                          note: { type: integer, minimum: 0, maximum: 20 }
                          commentaire: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # ETUDIANT_INCONNU

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
        Codes métier utilisés : CODE_INCONNU, CODE_EXPIRE, BLOCAGE_ACTIF,
        DEJA_PRESENT, LIEN_INVALIDE, EXERCICE_DEJA_DEPOSE, NOTE_INVALIDE,
        AUTO_RELECTURE, RELECTURE_DEJA_RENDUE, PROMOTION_INCONNUE,
        SESSION_INCONNUE, SESSION_CLOTUREE, SESSION_DEJA_CLOTUREE,
        LIEN_VERROUILLE, EXERCICE_INCONNU, RELECTURE_INCONNUE, ETUDIANT_INCONNU,
        RELECTEUR_DEJA_ASSIGNE.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
